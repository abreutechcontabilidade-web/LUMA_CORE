<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Jogo com IA</title><style>body{background:#050510;color:#00ffe1;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{border:2px solid #00ffe1;box-shadow:0 0 20px #00ffe1;}</style></head>
<body><canvas id="game" width="800" height="500"></canvas><script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
let bird={x:100,y:250,vy:0,w:30,h:20};let pipes=[];let score=0;let gameOver=false;let frames=0;
addEventListener('keydown',e=>{if(e.key===' '&&!gameOver) bird.vy=-8; if(gameOver&&e.key===' '){bird.y=250;bird.vy=0;pipes=[];score=0;gameOver=false;}});

function draw(){
        ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,800,500);
        if(gameOver){ctx.fillStyle='#fff';ctx.font='40px monospace';ctx.fillText('GAME OVER',250,250);return;}
        ctx.fillStyle='#00ffe1';ctx.fillRect(bird.x,bird.y,bird.w,bird.h);
        bird.vy+=0.5; bird.y+=bird.vy;
        if(bird.y>500||bird.y<0) gameOver=true;
        if(frames%120===0) pipes.push({x:800,y:Math.random()*300+100,w:80,h:250,passed:false});
        pipes.forEach(p=>{
            ctx.fillStyle='#ff2fd6'; ctx.fillRect(p.x,p.y,p.w,500);
            p.x-=4;
            if(bird.x+bird.w>p.x && bird.x<p.x+p.w && (bird.y<p.y || bird.y+bird.h>p.y+250)) gameOver=true;
            if(!p.passed && p.x+p.w<bird.x){ p.passed=true; score++; }
        });
        pipes=pipes.filter(p=>p.x>-100);
        ctx.fillStyle='#fff'; ctx.font='30px monospace'; ctx.fillText('SCORE: '+score, 20, 40);
        frames++;
    }
function update(t=0){draw();requestAnimationFrame(update);}
update();
</script></body></html>
