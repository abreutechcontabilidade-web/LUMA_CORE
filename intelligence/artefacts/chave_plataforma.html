<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Jogo Sintetizado</title><style>body{background:#050510;color:#00ffe1;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{border:2px solid #00ffe1;box-shadow:0 0 20px #00ffe1;}</style></head>
<body><canvas id="game" width="800" height="500"></canvas>
<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
let player={x:50,y:200,vy:0,w:20,h:30,onGround:false};let platforms=[{x:0,y:450,w:800,h:50},{x:200,y:350,w:150,h:20},{x:500,y:250,w:200,h:20}];
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')player.x-=5;if(e.key==='ArrowRight')player.x+=5;if(e.key==='ArrowUp'&&player.onGround){player.vy=-12;player.onGround=false;}});

function draw(){ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,800,500);player.vy+=0.5;player.y+=player.vy;player.onGround=false;platforms.forEach(p=>{if(player.x<p.x+p.w&&player.x+player.w>p.x&&player.y+player.h>p.y&&player.y+player.h<p.y+p.vy+10&&player.vy>0){player.vy=0;player.y=p.y-player.h;player.onGround=true;}});if(player.y>500)player.y=200;ctx.fillStyle='#00ffe1';platforms.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));ctx.fillStyle='#ff2fd6';ctx.fillRect(player.x,player.y,player.w,player.h);}
function update(t=0){draw();requestAnimationFrame(update);}
update();
</script></body></html>
