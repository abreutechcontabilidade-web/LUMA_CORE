<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Jogo com IA</title><style>body{background:#050510;color:#00ffe1;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{border:2px solid #00ffe1;box-shadow:0 0 20px #00ffe1;}</style></head>
<body><canvas id="game" width="800" height="500"></canvas><script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
let palavra='CYBERPUNK';let letras=[];let erros=0;let maxErros=6;let ganhou=false;
addEventListener('keydown',e=>{if(erros>=maxErros || palavra.split('').every(l=>letras.includes(l))) return; let l=e.key.toUpperCase(); if(l.length===1 && l>='A' && l<='Z'){ if(!letras.includes(l)){ letras.push(l); if(!palavra.includes(l)) erros++; } }});

function draw(){
        ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,800,500);
        ctx.fillStyle='#00ffe1'; ctx.font='30px monospace'; ctx.fillText('ERROS: '+erros+' / '+maxErros, 50, 50);
        
        ctx.fillStyle='#fff'; ctx.font='40px monospace';
        let display = palavra.split('').map(l => letras.includes(l) ? l : '_').join(' ');
        ctx.fillText(display, 150, 250);
        
        if (erros >= maxErros) { ctx.fillStyle='#ff2fd6'; ctx.fillText('VOCE PERDEU!', 200, 350); }
        else if (palavra.split('').every(l => letras.includes(l))) { ctx.fillStyle='#ff2fd6'; ctx.fillText('VOCE GANHOU!', 200, 350); }
    }
function update(t=0){draw();requestAnimationFrame(update);}
update();
</script></body></html>
