<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Cyberpunk Pong // Ouro Puro</title>
<style>
    body { background: #050510; color: #00ffe1; font-family: 'Courier New', monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
    canvas { border: 2px solid #00ffe1; box-shadow: 0 0 20px #00ffe1; background: #0a0a1a; }
    .scoreboard { display: flex; justify-content: space-between; width: 800px; font-size: 40px; margin-bottom: 20px; text-shadow: 0 0 10px #00ffe1; }
    .scoreboard span { color: #ff2fd6; }
</style>
</head>
<body>
<div class="scoreboard"><div>P1: <span id="score1">0</span></div><div>P2: <span id="score2">0</span></div></div>
<canvas id="game" width="800" height="500"></canvas>
<script>
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    const pw = 10, ph = 80, br = 8;
    let p1 = {x: 10, y: 210, score: 0}, p2 = {x: 790, y: 210, score: 0};
    let ball = {x: 400, y: 250, dx: 5, dy: 5};
    const keys = {};
    document.addEventListener('keydown', e => keys[e.key] = true);
    document.addEventListener('keyup', e => keys[e.key] = false);
    function draw() {
        ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, 0, 800, 500);
        ctx.strokeStyle = '#1a1a2e'; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(400, 500); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#00ffe1'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffe1'; ctx.fillRect(p1.x, p1.y, pw, ph);
        ctx.fillStyle = '#ff2fd6'; ctx.shadowColor = '#ff2fd6'; ctx.fillRect(p2.x, p2.y, pw, ph);
        ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, br, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    }
    function update() {
        if (keys['w'] && p1.y > 0) p1.y -= 7; if (keys['s'] && p1.y < 420) p1.y += 7;
        if (keys['ArrowUp'] && p2.y > 0) p2.y -= 7; if (keys['ArrowDown'] && p2.y < 420) p2.y += 7;
        ball.x += ball.dx; ball.y += ball.dy;
        if (ball.y > 492 || ball.y < 8) ball.dy *= -1;
        if (ball.x < 20 && ball.y > p1.y && ball.y < p1.y+ph) ball.dx = Math.abs(ball.dx);
        if (ball.x > 780 && ball.y > p2.y && ball.y < p2.y+ph) ball.dx = -Math.abs(ball.dx);
        if (ball.x > 800) { p1.score++; document.getElementById('score1').innerText = p1.score; ball.x = 400; ball.y = 250; ball.dx = 5; }
        if (ball.x < 0) { p2.score++; document.getElementById('score2').innerText = p2.score; ball.x = 400; ball.y = 250; ball.dx = -5; }
        draw(); requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
