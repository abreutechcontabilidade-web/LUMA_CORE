<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Jogo Sintetizado</title><style>body{background:#050510;color:#00ffe1;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{border:2px solid #00ffe1;box-shadow:0 0 20px #00ffe1;}</style></head>
<body><canvas id="game" width="800" height="500"></canvas>
<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
let player={x:50,y:200,vy:0,w:20,h:30,onGround:false,dir:1};let platforms=[{x:0,y:450,w:800,h:50},{x:200,y:350,w:150,h:20},{x:500,y:250,w:200,h:20}];let bullets=[];let enemies=[{x:300,y:420,dir:1,alive:true},{x:600,y:220,dir:-1,alive:true}];
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){player.x-=5;player.dir=-1;}if(e.key==='ArrowRight'){player.x+=5;player.dir=1;}if(e.key==='ArrowUp'&&player.onGround){player.vy=-12;player.onGround=false;}if(e.key===' '){bullets.push({x:player.x+(player.dir===1?20:0),y:player.y+15,dir:player.dir});}});

function draw(){ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,800,500);
        player.vy+=0.5; player.y+=player.vy; player.onGround=false;
        platforms.forEach(p=>{
            if(player.x<p.x+p.w && player.x+player.w>p.x && player.y+player.h>p.y && player.y+player.h<p.y+player.vy+10 && player.vy>0){
                player.vy=0; player.y=p.y-player.h; player.onGround=true;
            }
        });
        if(player.y>500) player.y=200;
        ctx.fillStyle='#00ffe1'; platforms.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));
        ctx.fillStyle='#ff2fd6'; ctx.fillRect(player.x,player.y,player.w,player.h);
        
        bullets.forEach(b=>{ ctx.fillStyle='#fff'; ctx.fillRect(b.x,b.y,10,4); b.x+=b.dir*8; });
        bullets = bullets.filter(b=>b.x>0 && b.x<800);
        
        enemies.forEach(e=>{
            if(!e.alive) return;
            e.x+=e.dir*2; if(e.x<0||e.x>780) e.dir*=-1;
            ctx.fillStyle='#aa00ff'; ctx.fillRect(e.x,e.y,30,30);
            bullets.forEach(b=>{
                if(b.x>e.x && b.x<e.x+30 && b.y>e.y && b.y<e.y+30){ e.alive=false; b.x=-100; }
            });
            if(player.x<e.x+30 && player.x+player.w>e.x && player.y<e.y+30 && player.y+player.h>e.y){
                player.x=50; player.y=200;
            }
        });
    }
function update(t=0){draw();requestAnimationFrame(update);}
update();
</script></body></html>
