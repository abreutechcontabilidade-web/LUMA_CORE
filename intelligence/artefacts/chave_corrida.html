<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Jogo Sintetizado</title><style>body{background:#050510;color:#00ffe1;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{border:2px solid #00ffe1;box-shadow:0 0 20px #00ffe1;}</style></head>
<body><canvas id="game" width="800" height="500"></canvas>
<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
let car={x:380,y:400,w:30,h:50};let speed=5;let obstacles=[];let score=0;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')car.x-=20;if(e.key==='ArrowRight')car.x+=20;});

function draw(){ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,800,500);
        ctx.fillStyle='#00ffe1';
        ctx.font='20px monospace';
        ctx.fillText('SCORE: '+score+' | SPEED: '+speed.toFixed(1)+'x', 20, 40);
        ctx.fillRect(car.x,car.y,car.w,car.h);
        obstacles.forEach(o=>{
            ctx.fillStyle='#ff2fd6';
            ctx.fillRect(o.x,o.y,30,30);
            o.y+=speed;
            if(o.y>500){
                o.y=-50;
                o.x=Math.random()*750;
                score+=10;
                if(score % 50 === 0) speed += 0.5;
            }
        });
        if(Math.random()<0.02)obstacles.push({x:Math.random()*750,y:-50});
        obstacles.forEach(o=>{
            if(car.x<o.x+30&&car.x+car.w>o.x&&car.y<o.y+30&&car.y+car.h>o.y){
                car.x=380;car.y=400;
                obstacles=[];
                score=0;
                speed=5;
            }
        });
    }
function update(t=0){draw();requestAnimationFrame(update);}
update();
</script></body></html>
