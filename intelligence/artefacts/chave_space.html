<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Space Invaders</title>
<style>body{background:#050510;color:#00ffe1;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}canvas{border:2px solid #00ffe1;box-shadow:0 0 20px #00ffe1;}</style></head>
<body><canvas id="game" width="600" height="400"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let ship={x:280,y:360,w:40,h:20},bullets=[],aliens=[];
for(let c=0;c<6;c++)for(let r=0;r<3;r++)aliens.push({x:c*90+50,y:r*50+30,alive:true});
let keys={};addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){bullets.push({x:ship.x+18,y:ship.y,dy:-8});}});addEventListener('keyup',e=>keys[e.key]=false);
function draw(){ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,600,400);
ctx.fillStyle='#00ffe1';ctx.fillRect(ship.x,ship.y,ship.w,ship.h);
ctx.fillStyle='#fff';bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
aliens.forEach(a=>{if(a.alive){ctx.fillStyle='#ff2fd6';ctx.fillRect(a.x,a.y,30,20);}});}
function update(){if(keys['ArrowLeft'])ship.x-=5;if(keys['ArrowRight'])ship.x+=5;
if(ship.x<0)ship.x=0;if(ship.x>560)ship.x=560;
bullets.forEach(b=>b.y+=b.dy);bullets=bullets.filter(b=>b.y>0);
aliens.forEach(a=>{if(a.alive){bullets.forEach(b=>{if(b.x>a.x&&b.x<a.x+30&&b.y>a.y&&b.y<a.y+20){a.alive=false;b.y=-100;}});}});
draw();requestAnimationFrame(update);}update();
</script></body></html>
